<div class="auth-container">
    <h1>Reset Password</h1>
    <div *ngIf="isSignedIn">
        <p>An user has signed in, please sign out first.</p>
    </div>
    <div *ngIf="userData && !isSignedIn">
        <p>Password reset completed, and signed in as {{ userData?.getAccount()?.username }}</p>
    </div>
    <div *ngIf="isReset && !userData && !showAuthMethods && !showChallenge">
        <p>Password reset completed! Signing you in automatically...</p>
    </div>
    <form *ngIf="!showNewPassword && !showCode && !isSignedIn && !isReset && !showAuthMethods && !showChallenge"
        (ngSubmit)="startReset()">
        <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required
            [readonly]="showCode || showNewPassword" />
        <button *ngIf="!showCode && !showNewPassword" type="submit" [disabled]="loading">{{ loading ? 'Resetting...' :
            'Reset Password' }}</button>
    </form>
    <form *ngIf="showNewPassword" (ngSubmit)="submitNewPassword()">
        <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="New Password" required />
        <button type="button" (click)="submitNewPassword()" [disabled]="loading">{{ loading ? 'Submitting...' :
            'Submit New Password' }}</button>
    </form>

    <!-- Use shared code form -->
    <app-code-form *ngIf="showCode" [code]="code" [loading]="loading" [resendCountdown]="resendCountdown"
        placeholder="OTP Code" submitButtonText="Verify Code" submitButtonLoadingText="Verifying..."
        (codeChange)="code = $event" (submitForm)="submitCode()" (resend)="resendCode()">
    </app-code-form>

    <!-- Use shared auth method selection form -->
    <app-auth-method-selection-form *ngIf="showAuthMethods" [authMethods]="authMethods"
        [selectedAuthMethod]="selectedAuthMethod" [verificationContact]="verificationContact" [loading]="loading"
        [getPlaceholderText]="getPlaceholderText.bind(this)" (selectedAuthMethodChange)="selectedAuthMethod = $event"
        (verificationContactChange)="verificationContact = $event" (submitForm)="submitAuthMethod()">
    </app-auth-method-selection-form>

    <!-- Use shared challenge form -->
    <app-auth-method-challenge-form *ngIf="showChallenge" [challenge]="challenge" [loading]="loading"
        (challengeChange)="challenge = $event" (submitForm)="submitChallenge()">
    </app-auth-method-challenge-form>

    <div class="error" *ngIf="error">{{ error }}</div>
</div>
