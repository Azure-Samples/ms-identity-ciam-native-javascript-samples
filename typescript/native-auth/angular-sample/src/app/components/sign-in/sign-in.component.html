<div class="auth-container">
  <h1>Sign In</h1>
  <div *ngIf="isSignedIn">
    <p>Signed in as {{ userData?.getAccount()?.username }}</p>
  </div>
  <form *ngIf="!showPassword && !showCode && !isSignedIn && !showAuthMethods && !showChallenge" (ngSubmit)="startSignIn()">
    <input type="email" [(ngModel)]="username" name="username" placeholder="Email" required />
    <button type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign In' }}</button>
  </form>
  <form *ngIf="showPassword" (ngSubmit)="submitPassword()">
    <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required />
    <button type="submit" [disabled]="loading">{{ loading ? 'Verifying...' : 'Submit Password' }}</button>
  </form>
  <form *ngIf="showCode" (ngSubmit)="submitCode()">
    <input type="text" [(ngModel)]="code" name="code" placeholder="OTP Code" required />
    <button type="submit" [disabled]="loading">{{ loading ? 'Verifying...' : 'Submit Code' }}</button>
    <button type="button" 
            (click)="resendCode()" 
            [disabled]="resendCountdown > 0"
            [class.resend-disabled]="resendCountdown > 0">
      {{ resendCountdown > 0 ? 'Resend Code (' + resendCountdown + 's)' : 'Resend Code' }}
    </button>
  </form>
  
  <!-- Auth Method Selection Form -->
  <form *ngIf="showAuthMethods" (ngSubmit)="submitAuthMethod()">
    <h3>To secure your account, please add an authentication method.</h3>
    <div class="auth-methods">
      <select 
        class="auth-method-select"
        [(ngModel)]="selectedAuthMethod" 
        name="authMethod" 
        required>
        <option *ngFor="let authMethod of authMethods" [ngValue]="authMethod">
          {{ authMethod.challenge_channel }}
        </option>
      </select>
    </div>
    <input 
      type="email" 
      [(ngModel)]="verificationContact" 
      name="verificationContact" 
      [placeholder]="getPlaceholderText()" 
      required />
    <button type="submit" [disabled]="loading || !selectedAuthMethod || !verificationContact">
      {{ loading ? 'Adding...' : 'Add' }}
    </button>
  </form>

  <!-- Challenge Verification Form -->
  <form *ngIf="showChallenge" (ngSubmit)="submitChallenge()">
    <h3>Enter the code below to verify your method</h3>
    <input 
      type="text" 
      [(ngModel)]="challenge" 
      name="challenge" 
      placeholder="Enter verification code" 
      required />
    <button type="submit" [disabled]="loading || !challenge">
      {{ loading ? 'Verifying...' : 'Verify Code' }}
    </button>
  </form>
  
  <div class="error" *ngIf="error">{{ error }}</div>
</div>
