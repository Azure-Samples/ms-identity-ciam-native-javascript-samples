<div class="auth-container">
    <h1 class="title-large">Sign In</h1>
    <div *ngIf="isSignedIn">
        <p>Signed in as {{ userData?.getAccount()?.username }}</p>
    </div>
    <form *ngIf="!showPassword && !showCode && !isSignedIn && !showAuthMethods && !showChallenge"
        (ngSubmit)="startSignIn()">
        <input type="email" [(ngModel)]="username" name="username" placeholder="Email" required />
        <button type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign In' }}</button>
    </form>

    <!-- Use shared password form -->
    <app-password-form *ngIf="showPassword" [password]="password" [loading]="loading" submitButtonText="Submit Password"
        submitButtonLoadingText="Verifying..." (passwordChange)="password = $event" (submitForm)="submitPassword()">
    </app-password-form>

    <!-- Use shared code form -->
    <app-code-form *ngIf="showCode" [code]="code" [loading]="loading" [resendCountdown]="resendCountdown"
        placeholder="OTP Code" submitButtonText="Submit Code" submitButtonLoadingText="Verifying..."
        (codeChange)="code = $event" (submitForm)="submitCode()" (resend)="resendCode()">
    </app-code-form>

    <!-- Use shared auth method selection form -->
    <app-auth-method-selection-form *ngIf="showAuthMethods" [authMethods]="authMethods"
        [selectedAuthMethod]="selectedAuthMethod" [verificationContact]="verificationContact" [loading]="loading"
        [getPlaceholderText]="getPlaceholderText.bind(this)" (selectedAuthMethodChange)="selectedAuthMethod = $event"
        (verificationContactChange)="verificationContact = $event" (submitForm)="submitAuthMethod()">
    </app-auth-method-selection-form>

    <!-- Use shared challenge form -->
    <app-auth-method-challenge-form *ngIf="showChallenge" [challenge]="challenge" [loading]="loading"
        (challengeChange)="challenge = $event" (submitForm)="submitChallenge()">
    </app-auth-method-challenge-form>

    <div class="error" *ngIf="error">{{ error }}</div>
</div>
