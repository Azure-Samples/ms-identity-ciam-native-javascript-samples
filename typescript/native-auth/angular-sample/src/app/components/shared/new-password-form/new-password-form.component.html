<form class="auth-form" (ngSubmit)="submit()" novalidate>
    <input type="password" name="password" class="auth-input" [(ngModel)]="password" placeholder="Enter new password" autocomplete="new-password" required />
    <button type="submit" class="auth-button" [disabled]="loading">
        {{ loading ? "Setting password..." : "Set New Password" }}
    </button>
</form>
