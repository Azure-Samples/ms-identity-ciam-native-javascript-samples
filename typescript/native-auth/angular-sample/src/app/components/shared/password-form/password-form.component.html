<form class="auth-form" (ngSubmit)="onSubmit()" [attr.novalidate]="noValidate ? '' : null">
    <label for="auth-password">
        {{ passwordLabel }} *
        <input
            id="auth-password"
            type="password"
            class="auth-input"
            [ngModel]="password"
            (ngModelChange)="onPasswordChange($event)"
            name="password"
            [placeholder]="placeholder"
            [attr.pattern]="passwordPattern || null"
            [autocomplete]="autocomplete"
            [attr.aria-invalid]="passwordError ? 'true' : null"
            [attr.aria-describedby]="passwordError ? 'auth-password-error' : null"
            required
        />
        <span *ngIf="passwordError" id="auth-password-error" class="auth-field-error" role="alert">{{ passwordError }}</span>
    </label>
    <ng-content></ng-content>
    <button type="submit" class="auth-button" [disabled]="loading">
        {{ loading ? submitButtonLoadingText : submitButtonText }}
    </button>
</form>
