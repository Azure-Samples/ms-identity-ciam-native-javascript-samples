<div class="auth-container">
    <h1>Sign Up</h1>
    <div *ngIf="isSignedIn">
        <p>An user has signed in, please sign out first.</p>
    </div>
    <div *ngIf="userData && !isSignedIn">
        <p>Signed up complete, and signed in as {{ userData?.getAccount()?.username }}</p>
    </div>
    <div *ngIf="isSignedUp && !userData && !showAuthMethods && !showChallenge">
        <p>Sign up completed! Signing you in automatically...</p>
    </div>
    <form *ngIf="!showPassword && !showCode && !isSignedIn && !isSignedUp && !showAuthMethods && !showChallenge"
        (ngSubmit)="startSignUp()" autocomplete="off">
        <input type="text" [(ngModel)]="firstName" name="firstName" placeholder="First Name" required />
        <input type="text" [(ngModel)]="lastName" name="lastName" placeholder="Last Name" required />
        <input type="text" [(ngModel)]="jobTitle" name="jobTitle" placeholder="Job Title" required />
        <input type="text" [(ngModel)]="city" name="city" placeholder="City" required />
        <input type="text" [(ngModel)]="country" name="country" placeholder="Country" required />
        <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required />
        <button *ngIf="!showPassword && !showCode" type="submit" [disabled]="loading">{{ loading ? 'Signing up...' :
            'Sign Up' }}</button>
    </form>

    <!-- Use shared password form -->
    <app-password-form *ngIf="showPassword" [password]="password" [loading]="loading" submitButtonText="Submit Password"
        submitButtonLoadingText="Submitting..." (passwordChange)="password = $event" (submitForm)="submitPassword()">
    </app-password-form>

    <!-- Use shared code form -->
    <app-code-form *ngIf="showCode" [code]="code" [loading]="loading" [resendCountdown]="resendCountdown"
        placeholder="Verification Code" submitButtonText="Verify Code" submitButtonLoadingText="Verifying..."
        (codeChange)="code = $event" (submitForm)="submitCode()" (resend)="resendCode()">
    </app-code-form>

    <!-- Use shared auth method selection form -->
    <app-auth-method-selection-form *ngIf="showAuthMethods" [authMethods]="authMethods"
        [selectedAuthMethod]="selectedAuthMethod" [verificationContact]="verificationContact" [loading]="loading"
        [getPlaceholderText]="getPlaceholderText.bind(this)" (selectedAuthMethodChange)="selectedAuthMethod = $event"
        (verificationContactChange)="verificationContact = $event" (submitForm)="submitAuthMethod()">
    </app-auth-method-selection-form>

    <!-- Use shared challenge form -->
    <app-auth-method-challenge-form *ngIf="showChallenge" [challenge]="challenge" [loading]="loading"
        (challengeChange)="challenge = $event" (submitForm)="submitChallenge()">
    </app-auth-method-challenge-form>

    <div class="error" *ngIf="error">{{ error }}</div>
</div>
