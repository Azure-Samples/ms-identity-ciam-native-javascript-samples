<app-auth-step-layout title="V2 Reset Password" [error]="error" [busy]="loading || resendLoading" (restart)="restart()">
    <div class="auth-signed-in-message" *ngIf="userData">Password reset completed and signed in as {{ userData.getAccount().username }}</div>

    <app-auth-start-form
        *ngIf="!state && !userData"
        [(username)]="username"
        [showPassword]="false"
        [loading]="loading"
        [fieldErrors]="fieldErrors"
        usernamePlaceholder="Email"
        submitText="Reset Password"
        submittingText="Starting..."
        helperText="Enter the email address for the account whose password you want to reset."
        (fieldChange)="clearFieldError($event)"
        (submitForm)="startResetPassword()"
    >
    </app-auth-start-form>

    <app-method-selection-form
        *ngIf="methodSelectionState"
        [options]="methodOptions"
        [loading]="loading"
        description="Choose a verification method:"
        submitText="Send code"
        submittingText="Sending..."
        (submitSelection)="selectAuthMethod($event)"
    >
    </app-method-selection-form>

    <app-code-form
        *ngIf="codeState as currentCodeState"
        [code]="code"
        [loading]="loading"
        [resendLoading]="resendLoading"
        [resendCountdown]="resendCountdown"
        [sentTo]="currentCodeState.sentTo"
        [channel]="currentCodeState.channel"
        [codeLength]="currentCodeState.codeLength"
        [showDeliveryHint]="true"
        [noValidate]="true"
        [disableResendWhileLoading]="true"
        placeholder="Enter verification code"
        (codeChange)="code = $event"
        (submitForm)="submitCode()"
        (resend)="resendCode()"
    >
    </app-code-form>

    <app-new-password-form *ngIf="newPasswordState" [loading]="loading" (submitPassword)="submitNewPassword($event)"> </app-new-password-form>

    <app-method-selection-form
        *ngIf="registrationState && !selectedRegistrationMethod"
        [options]="registrationMethodOptions"
        [loading]="loading"
        description="Choose an authentication method to register:"
        submitText="Continue"
        submittingText="Continuing..."
        (submitSelection)="selectRegistrationMethod($event)"
    >
    </app-method-selection-form>

    <form *ngIf="registrationState && selectedRegistrationMethod as method" class="auth-form" (ngSubmit)="registerAuthMethod()">
        <label for="reset-registration-contact">
            {{ method.type === "email" ? "Email address" : "Phone number (with country code)" }}
        </label>
        <input
            id="reset-registration-contact"
            name="registrationContact"
            class="auth-input"
            [type]="method.type === 'email' ? 'email' : 'tel'"
            [autocomplete]="method.type === 'email' ? 'email' : 'tel'"
            [(ngModel)]="registrationContact"
            [disabled]="loading"
            required
        />
        <button type="submit" class="auth-button" [disabled]="loading || !registrationContact.trim()">
            {{ loading ? "Registering..." : "Register method" }}
        </button>
        <button type="button" class="auth-secondary-button" [disabled]="loading" (click)="selectedRegistrationMethod = null">
            Choose another method
        </button>
    </form>

    <app-code-form
        *ngIf="registrationVerificationState as currentRegistrationVerificationState"
        [code]="code"
        [loading]="loading"
        [resendLoading]="resendLoading"
        [resendCountdown]="resendCountdown"
        [sentTo]="currentRegistrationVerificationState.sentTo"
        [channel]="currentRegistrationVerificationState.method.channels?.[0] || currentRegistrationVerificationState.method.type"
        [codeLength]="currentRegistrationVerificationState.codeLength"
        [showDeliveryHint]="true"
        [noValidate]="true"
        [disableResendWhileLoading]="true"
        placeholder="Enter activation code"
        submitButtonText="Activate method"
        submitButtonLoadingText="Activating..."
        (codeChange)="code = $event"
        (submitForm)="submitRegistrationChallenge()"
        (resend)="resendRegistrationChallenge()"
    >
    </app-code-form>

    <div *ngIf="continuationState">
        <p class="auth-helper-text">
            {{ loading ? "Completing sign-in..." : "Sign-in after password reset needs to be retried." }}
        </p>
        <button *ngIf="!loading" type="button" class="auth-secondary-button" (click)="retryContinuation()">Retry sign-in</button>
    </div>

    <div class="auth-signed-in-message" *ngIf="isCompleted && !userData">Password reset completed.</div>
    <p *ngIf="loading && !state">Starting password reset...</p>
</app-auth-step-layout>
