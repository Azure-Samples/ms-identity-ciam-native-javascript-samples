<app-auth-step-layout title="V2 Reset Password" [error]="error" [busy]="loading || resendLoading" (restart)="restart()">
    <div class="auth-signed-in-message" *ngIf="userData">Password reset completed and signed in as {{ userData.getAccount().username }}</div>

    <app-auth-start-form
        *ngIf="!state && !userData"
        [(username)]="username"
        [showPassword]="false"
        [loading]="loading"
        usernamePlaceholder="Email"
        submitText="Reset Password"
        submittingText="Starting..."
        helperText="Enter the email address for the account whose password you want to reset."
        (submitForm)="startResetPassword()"
    >
    </app-auth-start-form>

    <app-method-selection-form
        *ngIf="methodSelectionState"
        [options]="methodOptions"
        [loading]="loading"
        description="Choose a verification method:"
        submitText="Send code"
        submittingText="Sending..."
        (submitSelection)="selectAuthMethod($event)"
    >
    </app-method-selection-form>

    <app-code-form
        *ngIf="codeState as currentCodeState"
        [code]="code"
        [loading]="loading"
        [resendLoading]="resendLoading"
        [resendCountdown]="resendCountdown"
        [sentTo]="currentCodeState.sentTo"
        [channel]="currentCodeState.channel"
        [codeLength]="currentCodeState.codeLength"
        [showDeliveryHint]="true"
        [noValidate]="true"
        [disableResendWhileLoading]="true"
        placeholder="Enter verification code"
        (codeChange)="code = $event"
        (submitForm)="submitCode()"
        (resend)="resendCode()"
    >
    </app-code-form>

    <app-new-password-form *ngIf="newPasswordState" [loading]="loading" (submitPassword)="submitNewPassword($event)"> </app-new-password-form>

    <div *ngIf="continuationState">
        <p class="auth-helper-text">
            {{ loading ? "Completing sign-in..." : "Sign-in after password reset needs to be retried." }}
        </p>
        <button *ngIf="!loading" type="button" class="auth-secondary-button" (click)="retryContinuation()">Retry sign-in</button>
    </div>

    <div class="auth-signed-in-message" *ngIf="isCompleted && !userData">Password reset completed.</div>
    <p *ngIf="loading && !state">Starting password reset...</p>
</app-auth-step-layout>
