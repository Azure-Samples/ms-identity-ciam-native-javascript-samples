<app-auth-step-layout title="V2 Sign Up" [error]="error" [busy]="loading || resendLoading" (restart)="restart()">
    <div class="auth-signed-in-message" *ngIf="userData">Signed up and signed in as {{ userData.getAccount().username }}</div>

    <app-auth-start-form
        *ngIf="!state && !userData"
        [(username)]="username"
        [(password)]="password"
        [loading]="loading"
        [fieldErrors]="fieldErrors"
        usernamePlaceholder="Email"
        submitText="Sign Up"
        submittingText="Signing up..."
        helperText="The password entered here is ignored. The service will request it later when required."
        (fieldChange)="clearFieldError($event)"
        (submitForm)="startSignUp()"
    >
    </app-auth-start-form>

    <app-code-form
        *ngIf="codeState as currentCodeState"
        [code]="code"
        [loading]="loading"
        [resendLoading]="resendLoading"
        [resendCountdown]="resendCountdown"
        [sentTo]="currentCodeState.sentTo"
        [channel]="currentCodeState.channel"
        [codeLength]="currentCodeState.codeLength"
        [showDeliveryHint]="true"
        [noValidate]="true"
        [disableResendWhileLoading]="true"
        placeholder="Enter verification code"
        (codeChange)="code = $event"
        (submitForm)="submitCode()"
        (resend)="resendCode()"
    >
    </app-code-form>

    <app-password-form
        *ngIf="passwordState as currentPasswordState"
        [password]="password"
        [loading]="loading"
        [passwordError]="fieldErrors['password']"
        [noValidate]="true"
        [passwordLabel]="currentPasswordState.requiredPasswordAttribute?.label || 'Password'"
        [passwordPattern]="currentPasswordState.requiredPasswordAttribute?.regex"
        submitButtonText="Submit Password"
        autocomplete="new-password"
        (passwordChange)="onPasswordChange($event)"
        (submitForm)="submitPassword()"
    >
        <p class="auth-helper-text">
            Choose your sign-up password here. The password entered on the initial form is not used.
        </p>
        <app-dynamic-attributes-form
            *ngIf="currentPasswordState.attributes.length > 0"
            [fields]="passwordAttributeFields"
            [values]="attributeValues"
            [fieldErrors]="fieldErrors"
            [fieldsOnly]="true"
            (valueChange)="onAttributeValueChange($event)"
        >
        </app-dynamic-attributes-form>
    </app-password-form>

    <app-dynamic-attributes-form
        *ngIf="attributesState"
        [fields]="attributeFields"
        [values]="attributeValues"
        [fieldErrors]="fieldErrors"
        [loading]="loading"
        (valueChange)="onAttributeValueChange($event)"
        (submitForm)="submitAttributes()"
    >
    </app-dynamic-attributes-form>

    <app-method-selection-form
        *ngIf="registrationState && !selectedRegistrationMethod"
        [options]="registrationMethodOptions"
        [loading]="loading"
        description="Choose an authentication method to register:"
        submitText="Continue"
        submittingText="Continuing..."
        (submitSelection)="selectRegistrationMethod($event)"
    >
    </app-method-selection-form>

    <form *ngIf="registrationState && selectedRegistrationMethod as method" class="auth-form" (ngSubmit)="enrollAuthMethod()">
        <label for="signup-registration-contact">
            {{ method.type === "email" ? "Email address" : "Phone number (with country code)" }}
        </label>
        <input
            id="signup-registration-contact"
            name="registrationContact"
            class="auth-input"
            [type]="method.type === 'email' ? 'email' : 'tel'"
            [autocomplete]="method.type === 'email' ? 'email' : 'tel'"
            [(ngModel)]="registrationContact"
            required
        />
        <button type="submit" class="auth-button" [disabled]="loading || !registrationContact.trim()">
            {{ loading ? "Registering..." : "Register method" }}
        </button>
        <button type="button" class="auth-secondary-button" [disabled]="loading" (click)="selectedRegistrationMethod = null">
            Choose another method
        </button>
    </form>

    <app-code-form
        *ngIf="activationState as currentActivationState"
        [code]="code"
        [loading]="loading"
        [resendLoading]="resendLoading"
        [resendCountdown]="resendCountdown"
        [sentTo]="currentActivationState.sentTo"
        [channel]="currentActivationState.type"
        [codeLength]="currentActivationState.codeLength"
        [showDeliveryHint]="true"
        [noValidate]="true"
        [disableResendWhileLoading]="true"
        placeholder="Enter activation code"
        submitButtonText="Activate method"
        submitButtonLoadingText="Activating..."
        (codeChange)="code = $event"
        (submitForm)="submitActivationCode()"
        (resend)="resendActivationCode()"
    >
    </app-code-form>

    <div *ngIf="continuationState">
        <p class="auth-helper-text">
            {{ loading ? "Completing sign-in..." : "Sign-in after sign-up needs to be retried." }}
        </p>
        <button *ngIf="!loading" type="button" class="auth-secondary-button" (click)="retryContinuation()">Retry sign-in</button>
    </div>

    <div class="auth-signed-in-message" *ngIf="isCompleted && !userData">Sign-up completed.</div>
    <p *ngIf="loading && !state">Starting sign-up...</p>
</app-auth-step-layout>
